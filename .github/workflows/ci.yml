name: Application checks
on: [push, pull_request]
jobs:
  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate free deployment without real credentials
        run: |
          python - <<'PY'
          import importlib.util, os
          from pathlib import Path
          spec = importlib.util.spec_from_file_location('prepare', 'deploy/free/prepare_env.py')
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.write_env('ci-demo.duckdns.org', 'synthetic-ci-key', Path(os.environ['RUNNER_TEMP']) / 'study-mate.env')
          PY
          DEMO_ENV_FILE="$RUNNER_TEMP/study-mate.env" docker compose --env-file "$RUNNER_TEMP/study-mate.env" -f deploy/free/compose.yml config --quiet
          bash -n deploy/free/deploy.sh
          bash -n deploy/free/backup.sh
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run format:check
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: study_mate_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/study_mate_test
      JWT_SECRET_KEY: ci-only-test-secret-not-for-deployment-01234567890123456789
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      REDIS_URL: redis://localhost:6379/0
      REQUIRE_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m app.ai.graph
        working-directory: backend
      - run: python -m alembic -c backend/alembic.ini check
      - run: python -m pytest -c backend/pytest.ini backend/tests -q
